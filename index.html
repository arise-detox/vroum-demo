<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' data: https://tile.openstreetmap.org; font-src 'self'; manifest-src 'self'; worker-src 'self'; connect-src 'self' https://router.project-osrm.org">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Vroum Démo">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="apple-touch-icon" href="icon-180.png">

<title>Vroum Démo</title>
<style>
@font-face{font-family:"Inter";src:url(fonts/Inter-Regular.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Inter";src:url(fonts/Inter-SemiBold.woff2) format("woff2");font-weight:600;font-display:swap}
@font-face{font-family:"Inter";src:url(fonts/Inter-Bold.woff2) format("woff2");font-weight:700;font-display:swap}
@font-face{font-family:"Inter";src:url(fonts/Inter-ExtraBold.woff2) format("woff2");font-weight:800;font-display:swap}
:root{--bg:#f6f6f6;--card:#fff;--text:#000;--muted:#6b6b6b;--line:#e4e4e4;--brand:#000;--on:#fff;--brand2:#f59e0b;--ok:#16a34a;--bad:#dc2626;
--land:#ececec;--shadow:0 -6px 24px rgba(0,0,0,.14);
--font:"Inter",-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Helvetica,Arial,system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#000;--card:#121212;--text:#fff;--muted:#a3a3a3;--line:#2b2b2b;--brand:#fff;--on:#000;--brand2:#fbbf24;--ok:#4ade80;--bad:#f87171;
--land:#151515;--shadow:0 -6px 24px rgba(0,0,0,.6)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:16px/1.4 var(--font);-webkit-font-smoothing:antialiased;overscroll-behavior:none}
#app{display:flex;flex-direction:column;height:100dvh;max-width:520px;margin:0 auto;position:relative;background:var(--bg)}
header{display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 8px) 12px 8px}
.brand{font-weight:800;font-size:1.2rem;letter-spacing:-.03em;color:var(--text)}
.demo{display:inline-block;margin-left:6px;font-size:.62rem;font-weight:700;letter-spacing:.04em;padding:2px 6px;border-radius:99px;background:var(--brand2);color:#1c1300;vertical-align:middle}
.modes{margin-left:auto;display:flex;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:2px}
.modes button{border:0;background:none;color:var(--muted);padding:6px 12px;border-radius:99px;font:inherit;font-size:.85rem;font-weight:600}
.modes button[aria-pressed=true]{background:var(--brand);color:var(--on)}
.modes button:disabled{opacity:.5}
.icon{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:50%;width:36px;height:36px;font-size:1rem}
.mapwrap{position:relative;flex:1;min-height:180px;overflow:hidden}
#map{width:100%;height:100%;background:var(--land);font:inherit}
.leaflet-container{font-family:var(--font)}
.leaflet-control-attribution{font-size:9px;background:color-mix(in srgb,var(--card) 80%,transparent)!important;color:var(--muted)!important}
.leaflet-control-attribution a{color:var(--muted)!important}
.leaflet-tile-pane{filter:grayscale(1) contrast(1.05) brightness(1.03)}
@media (prefers-color-scheme:dark){.leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) grayscale(1) brightness(.82) contrast(1.1)}}
.rt-case{stroke:var(--bg)}.rt-line{stroke:var(--brand)}
.pin{width:18px;height:18px;border-radius:50%;background:var(--brand);border:3px solid var(--bg);box-shadow:0 1px 5px rgba(0,0,0,.45)}
.pin.to{border-radius:4px;background:var(--brand2)}
.carwrap{width:30px;height:30px;display:grid;place-items:center}
.car2{width:16px;height:28px;border-radius:8px;background:var(--brand);border:2px solid var(--bg);box-shadow:0 1px 6px rgba(0,0,0,.55);position:relative}
.car2::before{content:"";position:absolute;left:2px;right:2px;top:5px;height:7px;border-radius:3px;background:var(--on);opacity:.85}
.leaflet-tooltip.lbl{background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:8px;font-weight:700;font-size:.74rem;padding:2px 7px;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.leaflet-tooltip.lbl::before{display:none}
.pill{position:absolute;top:8px;left:10px;z-index:1000;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:5px 12px;font-size:.82rem;font-weight:700;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.speed{position:absolute;top:8px;right:10px;z-index:1000;display:flex;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:2px}
.speed button{border:0;background:none;color:var(--muted);padding:3px 9px;border-radius:99px;font:inherit;font-size:.78rem;font-weight:700}
.speed button[aria-pressed=true]{background:var(--brand);color:var(--on)}
.sheet{background:var(--card);border-radius:20px 20px 0 0;box-shadow:var(--shadow);padding:16px 16px calc(env(safe-area-inset-bottom) + 14px);position:relative;z-index:2}
.sheet h2{margin:0 0 2px;font-size:1.3rem;letter-spacing:-.02em}
.sub{margin:0 0 12px;color:var(--muted);font-size:.9rem}
.btn{display:block;width:100%;border:0;border-radius:10px;padding:14px;font:inherit;font-weight:700;font-size:1rem;background:var(--brand);color:var(--on);cursor:pointer}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
.btn.warn{background:var(--brand2);color:#1c1300}
.btn:disabled{opacity:.45}
.row{display:flex;gap:10px;margin-top:12px}.row>*{flex:1}
.who{display:flex;align-items:center;gap:10px;font-weight:700}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--brand);color:var(--on);display:grid;place-items:center;font-weight:800}
.fare{font-size:1.9rem;font-weight:800;letter-spacing:-.02em;margin:6px 0 0}
.meta{color:var(--muted);font-size:.88rem}
.route2{margin:8px 0;padding:8px 10px;background:var(--bg);border-radius:10px;font-size:.92rem}
.bar{height:5px;background:var(--line);border-radius:9px;overflow:hidden;margin-bottom:10px}
.bar i{display:block;height:100%;background:var(--brand2);transition:width 1s linear}
.prog{height:6px;background:var(--line);border-radius:9px;overflow:hidden;margin:8px 0}
.prog i{display:block;height:100%;background:var(--brand);width:0}
.radar{width:54px;height:54px;border-radius:50%;margin:2px auto 10px;background:radial-gradient(circle,var(--brand) 0 18%,transparent 20%);position:relative}
.radar::before,.radar::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid var(--brand);animation:ping 1.8s infinite;opacity:0}
.radar::after{animation-delay:.9s}
@keyframes ping{0%{transform:scale(.3);opacity:.9}100%{transform:scale(1.6);opacity:0}}
.stars{display:flex;justify-content:center;gap:4px;margin:8px 0}
.stars button{border:0;background:none;font-size:2rem;color:var(--line);padding:0 2px}
.stars button.on{color:var(--brand2)}
.opts{display:grid;gap:8px;margin:8px 0}
.opt{display:flex;align-items:center;gap:10px;padding:10px 12px;border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--text);font:inherit;text-align:left;width:100%}
.opt[aria-pressed=true]{border-color:var(--brand)}
.opt b{margin-left:auto}
.opt small{display:block;color:var(--muted)}
select{width:100%;padding:11px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text);font:inherit;margin-bottom:8px}
.tips{display:flex;gap:8px;justify-content:center;margin:6px 0}
.tips button{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:99px;padding:6px 14px;font:inherit;font-weight:600}
.tips button[aria-pressed=true]{background:var(--brand);color:var(--on);border-color:var(--brand)}
.legal{margin:10px 0 0;text-align:center;color:var(--muted);font-size:.72rem}
.overlay{position:fixed;inset:0;background:var(--bg);z-index:2000;overflow:auto;padding:calc(env(safe-area-inset-top) + 12px) 14px 20px;max-width:520px;margin:0 auto}
.overlay h2{margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.k small{display:block;color:var(--muted);font-size:.78rem}.k b{font-size:1.25rem}
.h{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:9px 0;border-top:1px solid var(--line);font-size:.92rem}
.h:first-child{border-top:0}.h .meta{grid-column:1}.h b{grid-row:1/3;grid-column:2;align-self:center}
[hidden]{display:none!important}
</style>
</head>
<body>
<div id="app">
  <header>
    <span class="brand">Vroum<span class="demo">DÉMO · courses fictives</span></span>
    <div class="modes" role="group" aria-label="Mode">
      <button data-m="driver" aria-pressed="true">Chauffeur</button>
      <button data-m="rider" aria-pressed="false">Passager</button>
    </div>
    <button class="icon" id="hist-btn" aria-label="Historique">📋</button>
  </header>
  <div class="mapwrap" id="mapwrap">
    <div id="map" role="region" aria-label="Plan de Paris"></div>
    <div class="pill" id="pill"></div>
    <div class="speed" id="speed" role="group" aria-label="Vitesse de simulation">
      <button data-s="1">1×</button><button data-s="2">2×</button><button data-s="4">4×</button>
    </div>
  </div>
  <section class="sheet" id="sheet" aria-live="polite"></section>
</div>

<div class="overlay" id="hist" hidden>
  <h2>Historique</h2>
  <div class="grid" id="hist-stats"></div>
  <div class="card" id="hist-list"></div>
  <div class="row">
    <button class="btn ghost" id="sound-btn"></button>
    <button class="btn ghost" id="reset-btn">Effacer l'historique</button>
  </div>
  <div class="row"><button class="btn" id="hist-close">Fermer</button></div>
  <p class="legal">Vroum est une application de démonstration : les courses, passagers, chauffeurs et prix sont fictifs. Aucun paiement, aucune vraie réservation. Les trajets sont calculés sur de vraies routes (© contributeurs OpenStreetMap, OSRM).</p>
</div>

<script src="vendor/leaflet/leaflet.js"></script>
<script>
"use strict";
// ============================================================
//  Vroum Démo — simulateur de VTC fictif (aucune vraie course)
// ============================================================
const $ = s => document.querySelector(s);
const KEY = "vroum-demo-v1";
const eur = new Intl.NumberFormat("fr-FR", { style: "currency", currency: "EUR" });
const rnd = (a, b) => a + Math.random() * (b - a);
const rint = (a, b) => Math.floor(rnd(a, b + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const round2 = n => Math.round(n * 100) / 100;
const fmtKm = k => k.toFixed(1).replace(".", ",");
const MS_PER_KM = 1400;        // durée de la simulation à vitesse 1× (un trajet de 10 km dure ~14 s)
const PAYOUT = 0.75;           // part du chauffeur (fictive)
const OSRM = "https://router.project-osrm.org/route/v1/driving/";
const CENTER = [48.8566, 2.3522];

// Lieux réels de Paris (coordonnées approximatives)
const PLACES = [
  { n: "Gare de Lyon", lat: 48.8443, lon: 2.3744 }, { n: "Place de la Bastille", lat: 48.8530, lon: 2.3693 },
  { n: "Tour Eiffel", lat: 48.8584, lon: 2.2945 }, { n: "Opéra Garnier", lat: 48.8720, lon: 2.3316 },
  { n: "Gare du Nord", lat: 48.8809, lon: 2.3553 }, { n: "Sacré-Cœur", lat: 48.8867, lon: 2.3431 },
  { n: "Musée du Louvre", lat: 48.8606, lon: 2.3376 }, { n: "République", lat: 48.8675, lon: 2.3637 },
  { n: "Notre-Dame", lat: 48.8530, lon: 2.3499 }, { n: "Gare Montparnasse", lat: 48.8421, lon: 2.3219 },
  { n: "Bercy", lat: 48.8387, lon: 2.3786 }, { n: "La Défense", lat: 48.8924, lon: 2.2360 },
  { n: "Aéroport d'Orly", lat: 48.7262, lon: 2.3652 }, { n: "Belleville", lat: 48.8723, lon: 2.3774 }
];
const FIRST = ["Camille", "Noah", "Inès", "Lucas", "Léa", "Hugo", "Sarah", "Yanis", "Manon", "Karim", "Emma", "Tom", "Jade", "Nora", "Enzo", "Lina"];
const LAST = "ABCDEFGHJKLMNPRSTV".split("");
const CARS = ["Berline électrique grise", "Compacte hybride bleue", "Monospace blanc", "Berline noire", "Citadine verte"];
const OPTIONS = [
  { id: "eco", n: "Éco", mult: 1, seats: "1-4 places", icon: "🚗" },
  { id: "comfort", n: "Confort", mult: 1.3, seats: "véhicule récent", icon: "🚙" },
  { id: "van", n: "Van", mult: 1.7, seats: "jusqu'à 6 places", icon: "🚐" }
];

// ---------- Persistance ----------
let S = loadState();
function loadState() {
  try {
    const s = JSON.parse(localStorage.getItem(KEY));
    if (s && Array.isArray(s.history)) return { history: s.history, speed: [1, 2, 4].includes(s.speed) ? s.speed : 1, mode: s.mode === "rider" ? "rider" : "driver", sound: s.sound !== false };
  } catch {}
  return { history: [], speed: 1, mode: "driver", sound: true };
}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch {} };
const dayKey = (d = new Date()) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;

// ---------- Géographie & tarifs (fonctions pures) ----------
const rad = d => d * Math.PI / 180;
function hav(a, b) {                                   // distance à vol d'oiseau en km
  const dLat = rad(b.lat - a.lat), dLon = rad(b.lon - a.lon);
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(rad(a.lat)) * Math.cos(rad(b.lat)) * Math.sin(dLon / 2) ** 2;
  return 12742 * Math.asin(Math.sqrt(h));
}
function bearing(p, q) {                               // cap en degrés entre deux points [lat, lon]
  const y = Math.sin(rad(q[1] - p[1])) * Math.cos(rad(q[0]));
  const x = Math.cos(rad(p[0])) * Math.sin(rad(q[0])) - Math.sin(rad(p[0])) * Math.cos(rad(q[0])) * Math.cos(rad(q[1] - p[1]));
  return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
}
function prepRoute(r) {                                // distances cumulées le long de l'itinéraire
  if (r.cum) return r;
  const cum = [0];
  for (let i = 1; i < r.pts.length; i++) cum.push(cum[i - 1] + hav({ lat: r.pts[i - 1][0], lon: r.pts[i - 1][1] }, { lat: r.pts[i][0], lon: r.pts[i][1] }));
  r.cum = cum; r.len = cum[cum.length - 1] || 0.001;
  return r;
}
function posAtKm(r, d) {                               // position [lat, lon] et cap après d km
  prepRoute(r);
  if (d >= r.len) { const n = r.pts.length; return { p: r.pts[n - 1], ang: n > 1 ? bearing(r.pts[n - 2], r.pts[n - 1]) : 0 }; }
  let lo = 1, hi = r.cum.length - 1;
  while (lo < hi) { const mid = (lo + hi) >> 1; if (r.cum[mid] < d) lo = mid + 1; else hi = mid; }
  const i = lo, seg = r.cum[i] - r.cum[i - 1] || 1e-9, t = Math.min(1, Math.max(0, (d - r.cum[i - 1]) / seg));
  const a = r.pts[i - 1], b = r.pts[i];
  return { p: [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t], ang: bearing(a, b) };
}
const kmToMin = km => Math.max(2, Math.round(km / 24 * 60));      // repli : ~24 km/h en ville
function fareFor(km, min, mult = 1) { return round2(Math.max(5, (2 + km * 1.05 + min * 0.3) * mult)); }
function randomNear(p, minKm, maxKm) {                // point à 1-3 km, pour la voiture du chauffeur
  const d = rnd(minKm, maxKm), a = rnd(0, 2 * Math.PI);
  return { lat: p.lat + d * Math.cos(a) / 111, lon: p.lon + d * Math.sin(a) / (111 * Math.cos(rad(p.lat))) };
}
function randomPlacePair() {
  const a = pick(PLACES);
  let b; do { b = pick(PLACES); } while (b === a || hav(a, b) < 2);
  return [a, b];
}
const person = () => ({ name: `${pick(FIRST)} ${pick(LAST)}.`, rating: round2(rnd(4.5, 5)) });

// ---------- Itinéraires réels (OSRM) ----------
const routeCache = new Map();
function getRoute(a, b) {
  const key = `${a.lat.toFixed(5)},${a.lon.toFixed(5)}>${b.lat.toFixed(5)},${b.lon.toFixed(5)}`;
  if (routeCache.has(key)) return routeCache.get(key);
  const p = (async () => {
    try {
      const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), 7000);
      const r = await fetch(`${OSRM}${a.lon},${a.lat};${b.lon},${b.lat}?overview=full&geometries=geojson`, { signal: ctl.signal });
      clearTimeout(t);
      const rt = (await r.json()).routes?.[0];
      if (!rt) throw new Error("no route");
      return prepRoute({ pts: rt.geometry.coordinates.map(([lo, la]) => [la, lo]), km: round2(rt.distance / 1000), min: Math.max(2, Math.round(rt.duration / 60 * 1.25)), real: true });
    } catch {                                           // hors-ligne ou serveur indisponible : trajet à vol d'oiseau
      routeCache.delete(key);
      const km = round2(hav(a, b) * 1.3);
      return prepRoute({ pts: [[a.lat, a.lon], [b.lat, b.lon]], km, min: kmToMin(km), real: false });
    }
  })();
  routeCache.set(key, p);
  return p;
}

// ---------- Carte (Leaflet + fond de plan) ----------
let map = null, routeGroup, pinGroup, carMarker, tiles, lastFit = null;
const TILE_URL = "https://tile.openstreetmap.org/{z}/{x}/{y}.png";
function initMap() {
  if (typeof L === "undefined") { $("#map").innerHTML = '<p class="meta" style="padding:20px;text-align:center">Carte indisponible (hors-ligne). La simulation continue sans fond de plan.</p>'; return; }
  map = L.map("map", { zoomControl: false, zoomSnap: 0.5, attributionControl: true }).setView(CENTER, 12);
  map.attributionControl.setPrefix('<a href="https://leafletjs.com">Leaflet</a>');
  routeGroup = L.layerGroup().addTo(map);
  pinGroup = L.layerGroup().addTo(map);
  tiles = L.tileLayer(TILE_URL, { maxZoom: 19, attribution: '© <a href="https://www.openstreetmap.org/copyright">contributeurs OpenStreetMap</a>' }).addTo(map);
  if (window.ResizeObserver) new ResizeObserver(() => { map.invalidateSize(); if (lastFit) fit(lastFit, false); }).observe($("#mapwrap"));
}
function fit(pts, animate = true) {
  if (!map || !pts || !pts.length) return;
  lastFit = pts;
  map.fitBounds(L.latLngBounds(pts), { padding: [34, 34], maxZoom: 16, animate });
}
function showRoute(pts) {
  if (!map) return;
  routeGroup.clearLayers();
  if (!pts) return;
  L.polyline(pts, { className: "rt-case", weight: 10, opacity: .95, lineCap: "round", lineJoin: "round", interactive: false }).addTo(routeGroup);
  L.polyline(pts, { className: "rt-line", weight: 4, opacity: 1, lineCap: "round", lineJoin: "round", interactive: false }).addTo(routeGroup);
}
function pinMarker(p, kind) {
  return L.marker([p.lat, p.lon], { interactive: false, icon: L.divIcon({ className: "", html: `<div class="pin ${kind}"></div>`, iconSize: [18, 18], iconAnchor: [9, 9] }) })
    .bindTooltip(p.n, { permanent: true, direction: "right", offset: [12, 0], className: "lbl" });
}
function showPins(from, to) {
  if (!map) return;
  pinGroup.clearLayers();
  if (from) pinMarker(from, "from").addTo(pinGroup);
  if (to) pinMarker(to, "to").addTo(pinGroup);
}
function setCar(p, ang) {
  if (!map) return;
  if (!carMarker) {
    carMarker = L.marker(p, { interactive: false, zIndexOffset: 1000, icon: L.divIcon({ className: "", html: '<div class="carwrap"><div class="car2"></div></div>', iconSize: [30, 30], iconAnchor: [15, 15] }) }).addTo(map);
  }
  carMarker.setLatLng(p);
  const el = carMarker.getElement();
  if (el && el.firstChild) el.firstChild.style.transform = `rotate(${ang}deg)`;
}
function clearMapTrip() {
  lastFit = null;
  if (!map) return;
  routeGroup.clearLayers(); pinGroup.clearLayers();
  if (carMarker) { map.removeLayer(carMarker); carMarker = null; }
  map.setView(CENTER, 12, { animate: true });
}

// ---------- Animation d'un déplacement le long d'un vrai itinéraire ----------
let anim = null;
function stopAnim() { if (anim) { anim.stop = true; cancelAnimationFrame(anim.raf); anim = null; } }
function drive(route, onTick, onDone) {
  stopAnim();
  prepRoute(route);
  const a = (anim = { stop: false, raf: 0 });
  const kmPerMs = route.len / Math.max(3000, route.len * MS_PER_KM);      // au moins 3 s, même pour un trajet court
  let d = 0, last = performance.now();
  const s0 = posAtKm(route, 0); setCar(s0.p, s0.ang);
  const step = now => {
    if (a.stop) return;
    d += Math.min(now - last, 100) * S.speed * kmPerMs;                   // un onglet en arrière-plan ne fait pas « sauter » la voiture
    last = now;
    if (d >= route.len) { const e = posAtKm(route, route.len); setCar(e.p, e.ang); onTick && onTick(1); anim = null; onDone && onDone(); return; }
    const s = posAtKm(route, d); setCar(s.p, s.ang); onTick && onTick(d / route.len);
    a.raf = requestAnimationFrame(step);
  };
  a.raf = requestAnimationFrame(step);
}

// ---------- Sons (synthétisés, aucun fichier audio) ----------
// Chaque son est une petite phrase de notes « cloche » (sinus + harmoniques) avec écho léger.
let actx = null, master = null;
function audio() {
  if (!actx) {
    actx = new (window.AudioContext || window.webkitAudioContext)();
    const comp = actx.createDynamicsCompressor(), dly = actx.createDelay(), fb = actx.createGain(), wet = actx.createGain();
    master = actx.createGain(); master.gain.value = .5;
    dly.delayTime.value = .14; fb.gain.value = .28; wet.gain.value = .32;
    master.connect(comp); master.connect(dly); dly.connect(fb); fb.connect(dly); dly.connect(wet); wet.connect(comp);
    comp.connect(actx.destination);
  }
  if (actx.state === "suspended") actx.resume();
  return actx;
}
function bell(freq, t, dur, vol) {
  const c = audio(), g = c.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + .012);               // attaque courte
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);             // longue résonance
  g.connect(master);
  [[freq, "sine", 1], [freq * 2, "sine", .26], [freq * 3.01, "triangle", .08]].forEach(([f, type, m]) => {
    const o = c.createOscillator(), og = c.createGain();
    o.type = type; o.frequency.value = f; og.gain.value = m;
    o.connect(og); og.connect(g); o.start(t); o.stop(t + dur + .05);
  });
}
const E5 = 659.25, G5s = 830.61, B5 = 987.77, E6 = 1318.51;
const SFX = {
  request: { vib: [120, 80, 120, 80, 200], n: [[E5, 0, .5, .5], [G5s, .11, .5, .5], [B5, .22, .5, .5], [E6, .33, .8, .55], [E5, .8, .5, .45], [G5s, .91, .5, .45], [B5, 1.02, .5, .45], [E6, 1.13, .9, .5]] },
  accept:  { vib: [60], n: [[1174.66, 0, .3, .5], [1567.98, .07, .45, .45]] },
  found:   { vib: [100, 60, 100], n: [[783.99, 0, .35, .45], [987.77, .1, .35, .45], [1174.66, .2, .7, .5]] },
  arrive:  { vib: [150], n: [[1046.5, 0, .5, .5], [783.99, .18, .9, .5]] },
  done:    { vib: [80, 60, 80, 60, 200], n: [[523.25, 0, .5, .45], [659.25, .09, .5, .45], [783.99, .18, .5, .45], [1046.5, .27, 1.2, .55]] },
  tick:    { vib: null, n: [[1500, 0, .07, .22]] }
};
function sfx(name) {
  if (!S.sound) return;
  try {
    const c = audio(), s = SFX[name], t0 = c.currentTime + .02;
    s.n.forEach(([f, off, dur, vol]) => bell(f, t0 + off, dur, vol));
    if (s.vib && navigator.vibrate) navigator.vibrate(s.vib);
  } catch {}
}
// iOS/Safari ne jouent un son qu'après un geste de l'utilisateur : on « débloque » l'audio dès le premier toucher.
window.addEventListener("pointerdown", () => { if (S.sound) { try { audio(); } catch {} } }, { passive: true });

// ---------- Interface commune ----------
const sheet = $("#sheet");
const setSheet = html => { sheet.innerHTML = html + '<p class="legal">Démo : courses, personnes et prix fictifs.</p>'; };
const stars = cur => `<div class="stars" role="group" aria-label="Note">${[1, 2, 3, 4, 5].map(i => `<button data-act="star" data-v="${i}" class="${i <= cur ? "on" : ""}" aria-label="${i} étoile${i > 1 ? "s" : ""}">★</button>`).join("")}</div>`;
const initials = n => n.split(" ")[0].slice(0, 1);
let timers = [];
const later = (fn, ms) => { const t = setTimeout(fn, ms); timers.push(t); return t; };
const clearTimers = () => { timers.forEach(clearTimeout); timers = []; };
let busy = false;       // une course est en cours : on ne change pas de mode

function updatePill() {
  const today = dayKey();
  if (S.mode === "driver") {
    const l = S.history.filter(h => h.role === "driver" && h.date === today);
    $("#pill").textContent = `Aujourd'hui : ${eur.format(round2(l.reduce((s, h) => s + h.net, 0)))} · ${l.length} course${l.length > 1 ? "s" : ""}`;
  } else {
    const l = S.history.filter(h => h.role === "rider" && h.date === today);
    $("#pill").textContent = `Dépensé aujourd'hui : ${eur.format(round2(l.reduce((s, h) => s + h.net, 0)))}`;
  }
}
function updateChrome() {
  document.querySelectorAll(".modes button").forEach(b => { b.setAttribute("aria-pressed", b.dataset.m === S.mode); b.disabled = busy && b.dataset.m !== S.mode; });
  document.querySelectorAll(".speed button").forEach(b => b.setAttribute("aria-pressed", +b.dataset.s === S.speed));
  updatePill();
}

// ============================================================
//  MODE CHAUFFEUR
// ============================================================
let D = { phase: "off", req: null, ride: null, rating: 5, left: 0, cd: null, tok: 0 };

function driverView() {
  const r = D.req, g = D.ride;
  switch (D.phase) {
    case "off":
      setSheet(`<h2>Vous êtes hors ligne</h2><p class="sub">Passez en ligne pour recevoir des courses fictives.</p><button class="btn" data-act="go">Se connecter</button>`); break;
    case "waiting":
      setSheet(`<div class="radar"></div><h2 style="text-align:center">Recherche de courses…</h2><p class="sub" style="text-align:center">Vous êtes en ligne, une demande va arriver.</p><button class="btn ghost" data-act="stop">Se déconnecter</button>`); break;
    case "request":
      setSheet(`<div class="bar"><i id="cd" style="width:${D.left / 15 * 100}%"></i></div>
        <div class="who"><span class="avatar">${initials(r.p.name)}</span><span>${r.p.name} <span class="meta">★ ${r.p.rating}</span></span><span class="meta" style="margin-left:auto">${r.opt.n}</span></div>
        <div class="fare">${eur.format(r.payout)}</div>
        <div class="meta">${fmtKm(r.km)} km · ${r.min} min · prise en charge dans ${r.pickMin} min</div>
        <div class="route2"><b>${r.from.n}</b><br>→ <b>${r.to.n}</b></div>
        <div class="row"><button class="btn ghost" data-act="decline">Refuser</button><button class="btn" data-act="accept">Accepter</button></div>`); break;
    case "toPickup":
      setSheet(`<h2>En route vers ${g.from.n}</h2><p class="sub">${g.p.name} · ★ ${g.p.rating}</p><div class="prog"><i id="pg"></i></div><p class="meta" id="eta">Arrivée dans ${g.pickMin} min</p>`); break;
    case "atPickup":
      setSheet(`<h2>Vous êtes arrivé</h2><p class="sub">${g.p.name} monte à bord…</p><button class="btn" data-act="start">Démarrer la course</button>`); break;
    case "trip":
      setSheet(`<div class="who"><span class="avatar">${initials(g.p.name)}</span><span>Course en cours</span></div>
        <div class="fare" id="live">${eur.format(0)}</div><div class="meta">vers <b>${g.to.n}</b></div>
        <div class="prog"><i id="pg"></i></div><p class="meta" id="eta">${g.min} min restantes</p>`); break;
    case "atDest":
      setSheet(`<h2>Destination atteinte</h2><p class="sub">${g.to.n}</p><button class="btn warn" data-act="end">Terminer la course</button>`); break;
    case "summary":
      setSheet(`<h2 style="text-align:center">Course terminée</h2><div class="fare" style="text-align:center">${eur.format(g.net)}</div>
        <p class="sub" style="text-align:center">${eur.format(g.payoutBase)} de course${g.tip ? ` + ${eur.format(g.tip)} de pourboire` : ""} · ${fmtKm(g.km)} km · ${g.min} min</p>
        <p class="meta" style="text-align:center;margin:0">Notez ${g.p.name}</p>${stars(D.rating)}
        <button class="btn" data-act="next">Continuer</button>`); break;
  }
}

function scheduleRequest() {
  clearTimers();
  later(newRequest, rint(2000, 5000) / S.speed);
}
async function newRequest() {
  const tok = ++D.tok;
  const [from, to] = randomPlacePair();
  const opt = pick([OPTIONS[0], OPTIONS[0], OPTIONS[1], OPTIONS[2]]);
  const carPos = randomNear(from, 1, 3.5);
  const [trip, pickup] = await Promise.all([getRoute(from, to), getRoute(carPos, from)]);      // vraies distances et durées
  if (tok !== D.tok || D.phase !== "waiting") return;
  const fare = fareFor(trip.km, trip.min, opt.mult);
  D.req = { from, to, opt, km: trip.km, min: trip.min, fare, payout: round2(fare * PAYOUT), p: person(), carPos, pickMin: pickup.min, trip, pickup };
  D.phase = "request"; D.left = 15;
  showPins(from, to); showRoute(pickup.pts); fit([...pickup.pts, ...trip.pts]);
  sfx("request"); driverView();
  D.cd = setInterval(() => {
    D.left--;
    if (D.left <= 3 && D.left > 0) sfx("tick");
    const el = $("#cd");
    if (el) el.style.width = (D.left / 15 * 100) + "%";
    if (D.left <= 0) { clearInterval(D.cd); declineRequest(); }
  }, 1000);
}
function declineRequest() {
  clearInterval(D.cd); D.tok++; D.req = null; D.phase = "waiting"; clearMapTrip(); driverView(); scheduleRequest();
}
function acceptRequest() {
  clearInterval(D.cd); D.tok++;
  sfx("accept");
  const r = D.req; D.req = null; busy = true; updateChrome();
  D.ride = { ...r, tip: 0 };
  D.phase = "toPickup"; driverView();
  showPins(r.from, null); showRoute(r.pickup.pts); fit(r.pickup.pts);
  drive(r.pickup, f => {
    const pg = $("#pg"), eta = $("#eta");
    if (pg) pg.style.width = (f * 100) + "%";
    if (eta) eta.textContent = `Arrivée dans ${Math.max(0, Math.ceil(r.pickMin * (1 - f)))} min`;
  }, () => { D.phase = "atPickup"; sfx("arrive"); driverView(); });
}
function startTrip() {
  const g = D.ride;
  D.phase = "trip"; driverView(); showPins(g.from, g.to); showRoute(g.trip.pts); fit(g.trip.pts);
  drive(g.trip, f => {
    const pg = $("#pg"), eta = $("#eta"), live = $("#live");
    if (pg) pg.style.width = (f * 100) + "%";
    if (eta) eta.textContent = `${Math.max(0, Math.ceil(g.min * (1 - f)))} min restantes`;
    if (live) live.textContent = eur.format(round2(g.payout * f));
  }, () => { D.phase = "atDest"; sfx("arrive"); driverView(); });
}
function endTrip() {
  const g = D.ride;
  g.tip = Math.random() < .45 ? pick([1, 1, 2, 2, 3, 5]) : 0;
  g.payoutBase = g.payout; g.net = round2(g.payout + g.tip);
  D.rating = 5; D.phase = "summary"; sfx("done"); driverView();
}
function finishRide() {
  const g = D.ride;
  S.history.unshift({ id: Date.now(), role: "driver", date: dayKey(), from: g.from.n, to: g.to.n, km: g.km, min: g.min, net: g.net, tip: g.tip, party: g.p.name, rating: D.rating });
  S.history = S.history.slice(0, 200); save();
  D.ride = null; busy = false; clearMapTrip(); updateChrome();
  D.phase = "waiting"; driverView(); scheduleRequest();
}

function driverAct(a) {
  switch (a) {
    case "go": D.phase = "waiting"; driverView(); scheduleRequest(); break;
    case "stop": clearTimers(); clearInterval(D.cd); D.tok++; D.req = null; D.phase = "off"; clearMapTrip(); driverView(); break;
    case "decline": declineRequest(); break;
    case "accept": acceptRequest(); break;
    case "start": startTrip(); break;
    case "end": endTrip(); break;
    case "next": finishRide(); break;
  }
}

// ============================================================
//  MODE PASSAGER
// ============================================================
let R = { phase: "form", from: PLACES[0], to: PLACES[3], opt: OPTIONS[0], ride: null, tip: 0, rating: 5, est: null, etas: { eco: 3, comfort: 4, van: 6 }, tok: 0 };

function riderEstimate() {                           // calcule l'itinéraire réel du trajet choisi
  const tok = ++R.tok;
  R.est = null; R.etas = { eco: rint(2, 5), comfort: rint(3, 7), van: rint(5, 9) };
  if (R.from === R.to) { riderView(); return; }
  showPins(R.from, R.to); riderView();
  getRoute(R.from, R.to).then(r => {
    if (tok !== R.tok || R.phase !== "form" || S.mode !== "rider") return;
    R.est = r; showRoute(r.pts); fit(r.pts); riderView();
  });
}
function riderView() {
  const g = R.ride;
  const placeOpts = sel => PLACES.map((p, i) => `<option value="${i}"${p === sel ? " selected" : ""}>${p.n}</option>`).join("");
  switch (R.phase) {
    case "form": {
      const e = R.est;
      setSheet(`<h2>Où allez-vous ?</h2>
        <select id="sel-from" aria-label="Départ">${placeOpts(R.from)}</select>
        <select id="sel-to" aria-label="Destination">${placeOpts(R.to)}</select>
        <p class="meta" style="margin:0">${R.from === R.to ? "Choisissez deux lieux différents." : e ? `${fmtKm(e.km)} km · environ ${e.min} min${e.real ? "" : " (estimation)"}` : "Calcul de l'itinéraire…"}</p>
        <div class="opts">${OPTIONS.map(o => `<button class="opt" data-act="opt" data-id="${o.id}" aria-pressed="${o.id === R.opt.id}"><span style="font-size:1.5rem">${o.icon}</span><span>${o.n}<small>${o.seats} · ${R.etas[o.id]} min</small></span><b>${e ? eur.format(fareFor(e.km, e.min, o.mult)) : "…"}</b></button>`).join("")}</div>
        <button class="btn" data-act="order"${e ? "" : " disabled"}>Commander ${R.opt.n}</button>`);
      break;
    }
    case "searching":
      setSheet(`<div class="radar"></div><h2 style="text-align:center">Recherche d'un chauffeur…</h2><p class="sub" style="text-align:center">${R.from.n} → ${R.to.n}</p><button class="btn ghost" data-act="cancel">Annuler</button>`); break;
    case "coming":
      setSheet(`<div class="who"><span class="avatar">${initials(g.d.name)}</span><span>${g.d.name} <span class="meta">★ ${g.d.rating}</span><br><span class="meta">${g.car} · ${g.plate}</span></span></div>
        <div class="prog"><i id="pg"></i></div><p class="meta" id="eta">Arrive dans ${g.pickMin} min</p>`); break;
    case "arrived":
      setSheet(`<h2>Votre chauffeur est arrivé</h2><p class="sub">${g.d.name} · ${g.car} · ${g.plate}</p><button class="btn" data-act="board">Je suis monté(e)</button>`); break;
    case "trip":
      setSheet(`<div class="who"><span class="avatar">${initials(g.d.name)}</span><span>En route vers ${R.to.n}</span></div>
        <div class="prog"><i id="pg"></i></div><p class="meta" id="eta">${g.min} min restantes</p><div class="fare">${eur.format(g.price)}</div>`); break;
    case "summary":
      setSheet(`<h2 style="text-align:center">Vous êtes arrivé(e)</h2><div class="fare" style="text-align:center">${eur.format(round2(g.price + R.tip))}</div>
        <p class="sub" style="text-align:center">${eur.format(g.price)} de course${R.tip ? ` + ${eur.format(R.tip)} de pourboire` : ""} · ${fmtKm(g.km)} km</p>
        <p class="meta" style="text-align:center;margin:0">Notez ${g.d.name}</p>${stars(R.rating)}
        <div class="tips" role="group" aria-label="Pourboire">${[0, 1, 2, 5].map(t => `<button data-act="tip" data-v="${t}" aria-pressed="${R.tip === t}">${t ? eur.format(t) : "Aucun"}</button>`).join("")}</div>
        <button class="btn" data-act="done">Terminer</button>`); break;
  }
}
async function riderOrder() {
  if (!R.est) return;
  busy = true; updateChrome();
  R.phase = "searching"; riderView(); clearTimers();
  const tok = ++R.tok, opt = R.opt, trip = R.est, carPos = randomNear(R.from, 1, 3.5);
  const [pickup] = await Promise.all([getRoute(carPos, R.from), new Promise(res => later(res, rint(2000, 3500) / S.speed))]);
  if (tok !== R.tok) return;
  R.ride = { d: person(), car: pick(CARS), plate: `DM-${rint(100, 999)}-OK`, km: trip.km, min: trip.min, price: fareFor(trip.km, trip.min, opt.mult), trip, pickup, pickMin: pickup.min };
  R.phase = "coming"; sfx("found"); riderView();
  showPins(R.from, R.to); showRoute(pickup.pts); fit(pickup.pts);
  drive(pickup, f => {
    const pg = $("#pg"), eta = $("#eta");
    if (pg) pg.style.width = (f * 100) + "%";
    if (eta) eta.textContent = `Arrive dans ${Math.max(0, Math.ceil(R.ride.pickMin * (1 - f)))} min`;
  }, () => { R.phase = "arrived"; sfx("arrive"); riderView(); });
}
function riderBoard() {
  const g = R.ride;
  R.phase = "trip"; riderView(); showPins(R.from, R.to); showRoute(g.trip.pts); fit(g.trip.pts);
  drive(g.trip, f => {
    const pg = $("#pg"), eta = $("#eta");
    if (pg) pg.style.width = (f * 100) + "%";
    if (eta) eta.textContent = `${Math.max(0, Math.ceil(g.min * (1 - f)))} min restantes`;
  }, () => { R.tip = 0; R.rating = 5; R.phase = "summary"; sfx("done"); riderView(); });
}
function riderDone() {
  const g = R.ride;
  S.history.unshift({ id: Date.now(), role: "rider", date: dayKey(), from: R.from.n, to: R.to.n, km: g.km, min: g.min, net: round2(g.price + R.tip), tip: R.tip, party: g.d.name, rating: R.rating });
  S.history = S.history.slice(0, 200); save();
  R.ride = null; R.phase = "form"; busy = false; clearMapTrip(); updateChrome(); riderEstimate();
}
function riderAct(a, ds) {
  switch (a) {
    case "opt": R.opt = OPTIONS.find(o => o.id === ds.id) || R.opt; riderView(); break;
    case "order": riderOrder(); break;
    case "cancel": R.tok++; clearTimers(); stopAnim(); busy = false; R.phase = "form"; clearMapTrip(); updateChrome(); riderEstimate(); break;
    case "board": riderBoard(); break;
    case "tip": R.tip = +ds.v; riderView(); break;
    case "done": riderDone(); break;
  }
}

// ============================================================
//  Événements
// ============================================================
sheet.addEventListener("click", e => {
  const b = e.target.closest("[data-act]");
  if (!b) return;
  const a = b.dataset.act;
  if (a === "star") { if (S.mode === "driver") D.rating = +b.dataset.v; else R.rating = +b.dataset.v; render(); return; }
  if (S.mode === "driver") driverAct(a); else riderAct(a, b.dataset);
});
sheet.addEventListener("change", e => {
  if (S.mode !== "rider" || R.phase !== "form") return;
  if (e.target.id === "sel-from") R.from = PLACES[+e.target.value];
  else if (e.target.id === "sel-to") R.to = PLACES[+e.target.value];
  else return;
  riderEstimate();
});

document.querySelector(".modes").addEventListener("click", e => {
  const b = e.target.closest("button[data-m]");
  if (!b || b.disabled || b.dataset.m === S.mode) return;
  S.mode = b.dataset.m; save();
  clearTimers(); clearInterval(D.cd); D.tok++; D.req = null; if (D.phase !== "off") D.phase = "off";
  R.tok++; clearMapTrip(); updateChrome(); render();
  if (S.mode === "rider") riderEstimate();
});
$("#speed").addEventListener("click", e => {
  const b = e.target.closest("button[data-s]");
  if (!b) return;
  S.speed = +b.dataset.s; save(); updateChrome();
});

function render() { if (S.mode === "driver") driverView(); else riderView(); updateChrome(); }

// Historique
function renderHistory() {
  const dr = S.history.filter(h => h.role === "driver"), ri = S.history.filter(h => h.role === "rider");
  const sum = l => round2(l.reduce((s, h) => s + h.net, 0));
  $("#hist-stats").innerHTML = `<div class="card k"><small>Gains chauffeur (fictifs)</small><b>${eur.format(sum(dr))}</b><small>${dr.length} course${dr.length > 1 ? "s" : ""}</small></div>
    <div class="card k"><small>Dépenses passager (fictives)</small><b>${eur.format(sum(ri))}</b><small>${ri.length} course${ri.length > 1 ? "s" : ""}</small></div>`;
  $("#hist-list").innerHTML = S.history.length ? S.history.slice(0, 60).map(h => `<div class="h"><span>${h.role === "driver" ? "🚗" : "🧍"} ${h.from} → ${h.to}</span><b>${eur.format(h.net)}</b><span class="meta">${h.date.split("-").reverse().join("/")} · ${fmtKm(h.km)} km · ${h.min} min · ${h.party} · ${"★".repeat(h.rating)}</span></div>`).join("") : '<p class="meta">Aucune course pour l\'instant.</p>';
  $("#sound-btn").textContent = S.sound ? "🔊 Son activé" : "🔇 Son coupé";
}
$("#hist-btn").onclick = () => { renderHistory(); $("#hist").hidden = false; };
$("#hist-close").onclick = () => { $("#hist").hidden = true; updatePill(); };
$("#sound-btn").onclick = () => { S.sound = !S.sound; save(); renderHistory(); };
$("#reset-btn").onclick = () => { if (confirm("Effacer tout l'historique de démonstration ?")) { S.history = []; save(); renderHistory(); updatePill(); } };

// ---------- Démarrage ----------
initMap();
render();
if (S.mode === "rider") riderEstimate();
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
